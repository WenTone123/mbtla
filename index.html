<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTLA Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: auto;
      padding: 30px;
    }

    h1 {
      text-align: center;
    }

    .section {
      margin-top: 60px;
    }

    .sample {
      margin-top: 50px;
      padding: 20px;
      border-radius: 15px;
      background: #f5f5f5;
    }

    img {
      width: 100%;
      border-radius: 10px;
    }

    .audio-grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 15px;
    }

    .audio-item {
      text-align: center;
      font-size: 14px;
    }

    .audio-item p {
      margin: 0 0 5px;
      font-weight: bold;
    }

    audio {
      width: 100%;
    }

    @media (max-width: 800px) {
      .audio-grid-4 {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <h1>MBTLA: Multi-Branch Temporal Linear Attention with Adaptive Retention Gate</h1>

  <!-- Section 1 -->
  <div class="section">
    <h2>1. Model Introduction</h2>
    <p>(To be added)</p>
  </div>

  <!-- Section 2 -->
  <div class="section">
    <h2>2. Audio Examples</h2>
    <div id="examples"></div>
  </div>

  <!-- Section 3 -->
  <div class="section">
    <h2>3. Visualization</h2>
    <p>(To be added)</p>
  </div>

  <script>
    const samples = ["0013", "0014", "0020"];

    const methods = [
      { label: "Clean", files: ["clean"] },
      { label: "Noisy", files: ["noisy"] },
      { label: "MBTLA", files: ["MBTLA", "FBTLA", "mbtla"] },
      { label: "ULUNAS", files: ["ULUNAS"] },
      { label: "GTCRN", files: ["GTCRN"] },
      { label: "LiSenNet", files: ["LiSenNet"] },
      { label: "AdaptCRN", files: ["AdaptCRN"] },
      { label: "FastEnhancer-Base", files: ["FastEnhancer_Base", "FastEnhancer-Base"] }
    ];

    function audioHTML(id, files) {
      const sources = files.map(f =>
        `<source src="demo/audio/${id}_${f}.wav" type="audio/wav">`
      ).join("");
      return `<audio controls preload="none">${sources}</audio>`;
    }

    document.getElementById("examples").innerHTML = samples.map((id, i) => {
      const items = methods.map(m => {
        return `<div class="audio-item">
                  <p>${m.label}</p>
                  ${audioHTML(id, m.files)}
                </div>`;
      }).join("");

      return `
        <div class="sample">
          <h3>Example ${i + 1}: Sample ${id}</h3>
          <img src="demo/pictures/${id}.png" alt="Sample ${id} spectrogram" loading="lazy">
          <div class="audio-grid-4">${items}</div>
        </div>
      `;
    }).join("");
  </script>

</body>
</html>
