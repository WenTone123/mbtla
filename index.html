<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>MBTLA Speech Enhancement Demo</title>


<style>

body{
font-family:Arial;
max-width:1000px;
margin:auto;
padding:30px;
}

h1{
text-align:center;
}

.card{
margin:30px 0;
padding:20px;
border-radius:12px;
box-shadow:0 0 10px #ddd;
}

img{
width:100%;
border-radius:10px;
}


.audio{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}


.item{
padding:10px;
background:#f5f5f5;
border-radius:8px;
}


audio{
width:100%;
}


</style>


</head>


<body>


<h1>
MBTLA Speech Enhancement Demo
</h1>


<p>

Multi-Branch Temporal Linear Attention with Adaptive Retention Gate

</p>



<div id="demo"></div>



<script>


const samples=[
"0013",
"0014"
];


const models=[

["Clean","clean",id+"_clean.wav"],

["Noisy","noisy",id+"_noisy.wav"],

["MBTLA","MBTLA",id+".wav"],

["GTCRN","GTCRN",id+"_GTCRN.wav"],

["LiSenNet","LiSenNet",id+"_LiSenNet.wav"],

["ULUNAS","ULUNAS",id+"_ULUNAS.wav"],

["AdaptCRN","AdaptCRN",id+"_AdaptCRN.wav"],

["FastEnhancer","FastEnhancer",id+".wav"]

];



let html="";


samples.forEach(id=>{


html+=`

<div class="card">

<h2>
Sample ${id}
</h2>


<img loading="lazy"
src="demo/pictures/${id}.png">


<div class="audio">

`;


models.forEach(m=>{


let path;


if(m[0]=="Clean")
path=`demo/audio/clean/${id}_clean.wav`;

else if(m[0]=="Noisy")
path=`demo/audio/noisy/${id}_noisy.wav`;

else if(m[0]=="MBTLA")
path=`demo/audio/MBTLA/${id}.wav`;

else if(m[0]=="FastEnhancer")
path=`demo/audio/FastEnhancer/${id}.wav`;

else
path=`demo/audio/${m[1]}/${id}_${m[0]}.wav`;



html+=`

<div class="item">

<b>${m[0]}</b>

<br>

<audio controls preload="none">

<source src="${path}" type="audio/wav">

</audio>

</div>

`;

});


html+=`

</div>

</div>

`;

});


document.getElementById("demo").innerHTML=html;


</script>



</body>
</html>
